name: Update Credits

on:
  schedule:
  - cron: "30 1 1,15 * *"
  
jobs:
  update-credits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Update credits
        shell: bash
        run: |
            chmod +x ./bin/gtool && ./bin/gtool -L graph
      - name: Update credits
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit-message: "credits: update credits"
