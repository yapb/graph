name: Update Credits

on:
  schedule:
  - cron: "30 1 1,15 * *"
  
jobs:
  update-credits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master
      - name: Update credits
        shell: bash
        run: |
            python3 ./tools/credits.py graph
      - name: Update credits
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "credits: update credits"
